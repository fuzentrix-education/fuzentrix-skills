# LMS HTML Policy: what the LMS keeps when HTML is pasted or imported. Every LMS HTML the skills write (quiz
# questions, options and explanations, cheatsheets, coding problems) is checked against these rules, so nothing
# is stripped or rejected on upload.
#
# From the LMS team's list of allowed and stripped tags (2026-10-22). The same rules apply wherever HTML goes;
# a context can narrow them with `extends` + `remove`. To change them, edit this file in the Configuration Pack
# (policy/lms-html.yaml) and publish a new release.
status: confirmed 2026-10-22

code:
  block: language_class          # code blocks are <pre><code class="language-…">; "bare" = <pre><code>
  languages: [plaintext, python, java, c, cpp, csharp, javascript, typescript, sql, html, css, bash, json]
  default_language: plaintext

images:
  # until an image is uploaded to the LMS, its src holds this address ({file}: the image's file name). It uses an
  # allowed protocol, so the <img> (with its alt text) survives pasting; replace it with the uploaded image.
  src: "https://fuzentrix-images.invalid/{file}"

contexts:
  cheatsheet_page:
    tags: [p, h1, h2, h3, h4, h5, h6, strong, b, em, i, u, del, strike, code, blockquote, pre, ul, ol, li, hr, br, a, span,
           img, table, colgroup, col, thead, tbody, tr, th, td]
    attributes:
      p: [style]
      h1: [style]
      h2: [style]
      h3: [style]
      h4: [style]
      h5: [style]
      h6: [style]
      strong: [class]
      b: [class]
      em: [class]
      i: [class]
      u: [class]
      del: [class]
      strike: [class]
      code: [class]
      blockquote: [class]
      ul: [class]
      ol: [class]
      li: [class]
      pre: [class, data-lang, style]
      a: [href, target, rel]
      span: [style]
      img: [src, alt, width, height, data-align, style]
      table: [style]
      th: [colwidth, data-colwidth, colspan, rowspan]
      td: [colwidth, data-colwidth, colspan, rowspan]
      col: [width]
    classes: {"*": ["*"]}
    style:
      p: [text-align]
      h1: [text-align]
      h2: [text-align]
      h3: [text-align]
      h4: [text-align]
      h5: [text-align]
      h6: [text-align]
      pre: [color, background-color, line-height]
      span: [color, background-color, font-family, font-size, line-height]
      img: ["*"]
      table: [width, max-width, table-layout]
    values:
      text-align: [left, center, right]
      target: [_blank]
      rel: [noopener, noreferrer, nofollow]
      data-align: [left, center, right]
    protocols:
      href: [http, https]
      src: [stream, http, https]
    max_bytes: 262144
  coding_problem:
    extends: cheatsheet_page
  quiz_question:
    extends: cheatsheet_page
    max_bytes: 65536
  quiz_option:
    extends: cheatsheet_page
    max_bytes: 32768
  quiz_explanation:
    extends: cheatsheet_page
    max_bytes: 32768
